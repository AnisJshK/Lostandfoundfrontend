<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost & Found Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Auth Section -->
  <div id="authSection">
    <h1>🔍 Lost & Found Portal</h1>
    <div class="auth-container">
      <div class="auth-tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>
      
      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <h2>Login</h2>
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      
      <!-- Register Form -->
      <form id="registerForm" class="auth-form" style="display: none;">
        <h2>Register</h2>
        <input type="text" id="registerName" placeholder="Full Name" required />
        <input type="email" id="registerEmail" placeholder="Email" required />
        <input type="tel" id="registerPhone" placeholder="Phone Number" required />
        <input type="password" id="registerPassword" placeholder="Password" required />
        <button type="submit">Register</button>
      </form>
    </div>
  </div>

  <!-- Main App Section -->
  <div id="appSection" style="display: none;">
    <header>
      <h1>🔍 Lost & Found Portal</h1>
      <div class="user-info">
        <span id="userName"></span>
        <button onclick="logout()" class="logout-btn">Logout</button>
      </div>
    </header>

    <!-- Report Type Selection -->
    <div class="report-type-selector">
      <button class="type-btn active" onclick="selectReportType('person')">
        👤 Missing Person
      </button>
      <button class="type-btn" onclick="selectReportType('item')">
        📦 Lost Item
      </button>
    </div>

    <!-- Report Form -->
    <form id="reportForm" class="report-form">
      <h2 id="formTitle">Report Missing Person</h2>
      
      <!-- Common Fields -->
      <input type="text" id="name" placeholder="Name" required />
      <textarea id="description" placeholder="Description" rows="3" required></textarea>
      <input type="text" id="location" placeholder="Location (where last seen/lost)" required />
      <input type="file" id="image" accept="image/*" />
      
      <!-- Person-specific Fields -->
      <div id="personFields">
        <input type="number" id="age" placeholder="Age" />
        <input type="text" id="lastSeenLocation" placeholder="Last seen location" />
        <input type="date" id="lastSeenDate" placeholder="Last seen date" />
        <textarea id="clothingDescription" placeholder="Clothing description" rows="2"></textarea>
      </div>
      
      <!-- Item-specific Fields -->
      <div id="itemFields" style="display: none;">
        <select id="category">
          <option value="">Select Category</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothing">Clothing</option>
          <option value="Keys">Keys</option>
          <option value="Documents">Documents</option>
          <option value="Jewelry">Jewelry</option>
          <option value="Bags">Bags</option>
          <option value="Other">Other</option>
        </select>
        <input type="text" id="color" placeholder="Color" />
      </div>
      
      <button type="submit">Submit Report</button>
    </form>

    <!-- Filter Section -->
    <div class="filters">
      <h2>View Reports</h2>
      <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterReports('all')">All</button>
        <button class="filter-btn" onclick="filterReports('person')">Missing Persons</button>
        <button class="filter-btn" onclick="filterReports('item')">Lost Items</button>
        <button class="filter-btn" onclick="filterReports('active')">Active</button>
        <button class="filter-btn" onclick="filterReports('found')">Found</button>
      </div>
    </div>

    <!-- Reports Container -->
    <div id="reportsContainer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
